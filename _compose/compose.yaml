version: "3.9"

services:
  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=1234
      - MYSQL_DATABASE=loan_db
    volumes:
      - type: volume
        source: mysql_data
        target: /var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
    external: true
